packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: true
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
minimumReleaseAgeExclude:
  - "@tsc-ts/darwin-arm64@0.0.2"
  - "@tsc-ts/darwin-x64@0.0.2"
  - "@tsc-ts/linux-arm64-gnu@0.0.2"
  - "@tsc-ts/linux-arm64-musl@0.0.2"
  - "@tsc-ts/linux-x64-gnu@0.0.2"
  - "@tsc-ts/linux-x64-musl@0.0.2"
  - "@tsc-ts/win32-x64-msvc@0.0.2"
  - tsc-ts@0.0.2
overrides:
  vite@*: "catalog:"
  vitest@*: 5.0.5
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
